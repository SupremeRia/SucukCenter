name: Windows doğrulama ve paketleme
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npx playwright install ffmpeg
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:expenses-ui
      - run: npm run test:monthly-ui
      - run: npm run test:accounts-ui
      - run: npm run test:preorders-ui
      - run: npm run test:audit-ui
      - run: npm run test:records-ui
      - run: npm run test:choices-ui
      - run: npm run test:design-ui
      - run: npm run test:calendar-focus-ui
      - run: npm run test:appearance-ui
      - run: npm run test:startup-ui
      - run: npm run test:brand
      - run: npm run test:performance
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:package
      - run: npm run build:review-test
      - run: npm run test:review-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: SucukCenter-Windows-x64
          path: review-builds/final/*Kurulum.exe
          if-no-files-found: error
